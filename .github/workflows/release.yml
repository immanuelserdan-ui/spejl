name: Build and publish Spejl installer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the installer publicly after confirming distribution rights
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set release version
        id: version
        shell: pwsh
        run: |
          # Local installers advanced through 0.1.41 while CI was at run 34.
          $version = "0.1.$([int]$env:GITHUB_RUN_NUMBER + 7)"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[raster,gui,dev]" pyinstaller typing-extensions

      - name: Build frozen app
        shell: pwsh
        run: |
          Set-Content -Path spejl\_build_version.py -Value "__version__ = '$env:APP_VERSION'" -Encoding utf8
          python -m PyInstaller spejl.spec --noconfirm --clean --workpath build-installer --distpath dist-installer

      # The build leaves out libraries Spejl never loads (see spejl.spec). Prove
      # the frozen app still works before anything is published.
      - name: Self-test the frozen app
        shell: pwsh
        run: |
          $report = Join-Path $PWD "self-test"
          $process = Start-Process -FilePath "dist-installer\Spejl\Spejl.exe" -ArgumentList "--self-test", "`"$report`"" -Wait -PassThru
          Get-Content (Join-Path $report "self-test.json")
          if ($process.ExitCode -ne 0) { throw "Frozen app self-test failed (exit $($process.ExitCode))." }

      - name: Check the frozen app opens its window
        run: python tools/smoke_packaged_app.py dist-installer/Spejl/Spejl.exe --timeout 90

      - name: Stage installer payload
        run: python tools/prepare_installer.py dist-installer/Spejl installer/payload

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:APP_VERSION" `
            "/DPayloadDir=$PWD\installer\payload" `
            "/DReleaseDir=$PWD\release" `
            installer\Spejl.iss

      - name: Upload installer for optional publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spejl-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7.0.0
        with:
          name: spejl-installer
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Spejl ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: release/*.exe
