name: Build and publish Spejl installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set release version
        shell: pwsh
        run: echo "APP_VERSION=0.1.${{ github.run_number }}" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[raster,gui,dev]" pyinstaller typing-extensions

      - name: Build frozen app
        shell: pwsh
        run: |
          Set-Content -Path spejl\_build_version.py -Value "__version__ = '$env:APP_VERSION'" -Encoding utf8
          python -m PyInstaller spejl.spec --noconfirm --clean --workpath build-installer --distpath dist-installer

      - name: Stage installer payload
        run: python tools/prepare_installer.py dist-installer/Spejl installer/payload

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:APP_VERSION" `
            "/DPayloadDir=$PWD\installer\payload" `
            "/DReleaseDir=$PWD\release" `
            installer\Spejl.iss

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Spejl ${{ env.APP_VERSION }}
          generate_release_notes: true
          files: release/*.exe
