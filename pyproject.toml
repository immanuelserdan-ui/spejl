[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spejl"
version = "0.1.0"
description = "Mirror floor plans without mirroring the text."
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
raster = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pillow>=10.3",
    "rapidocr-onnxruntime>=1.3",
    "rapidfuzz>=3.9",
    "scipy>=1.13",
]
gui = [
    "PySide6>=6.7",
]

[project.scripts]
spejl = "spejl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["spejl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
